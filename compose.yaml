name: just4kids

services:
  db:
    image: mysql:8.0
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: just4kids
      MYSQL_USER: just4kids
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the production env file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the production env file}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: docker.api
      target: builder
    mem_limit: 512m
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in the production env file}
    command: ['pnpm', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker.api
    mem_limit: 384m
    env_file: ${API_ENV_FILE:?Set API_ENV_FILE to a production env file such as .env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in the production env file}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    expose:
      - '4000'
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4030}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker.web
      args:
        API_INTERNAL_URL: http://api:4000
    mem_limit: 384m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3030}:3000'
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
  uploads-data:
