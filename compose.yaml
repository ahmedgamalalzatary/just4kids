name: just4kids

services:
  db:
    image: mysql:8.0
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: just4kids
      MYSQL_USER: just4kids
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the production env file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the production env file}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: docker.api
      target: builder
    mem_limit: 512m
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in the production env file}
    command: ['pnpm', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker.api
    mem_limit: 384m
    env_file: ${API_ENV_FILE:?Set API_ENV_FILE to a production env file such as .env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in the production env file}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    expose:
      - '4000'
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4030}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker.web
      args:
        API_INTERNAL_URL: http://api:4000
    mem_limit: 384m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3030}:3000'
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # WhatsApp gateway for the phase 12 intake (opt-in: `docker compose --profile whatsapp ...`).
  # Settings follow OpenWA v0.25.0's own compose file; its dashboard (QR linking) listens on the loopback address only.
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.25.0
    profiles: ['whatsapp']
    # OpenWA's ordered shutdown needs up to 75 seconds.
    stop_grace_period: 75s
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    pids_limit: 2048
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      TZ: UTC
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      PORT: 2785
      # Empty generates a random admin key into the data volume (data/.api-key); production refuses one under 32 characters.
      API_MASTER_KEY: ${OPENWA_MASTER_KEY:-}
      # Empty keeps OpenWA's default engine (whatsapp-web.js), selectable in its dashboard.
      ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-}
      # Reconnect the linked number after a restart; production OpenWA leaves sessions stopped otherwise.
      AUTO_START_SESSIONS: 'true'
      # Senders behind WhatsApp privacy ids (@lid) carry their phone in the webhook.
      RESOLVE_LID_TO_PHONE: 'true'
      # The webhook targets the API on this private network (http://api:4000/whatsapp/webhook).
      SSRF_ALLOWED_HOSTS: api
    volumes:
      # Linked session, OpenWA's own database and API keys; losing it unlinks the number.
      - openwa-data:/app/data
    expose:
      - '2785'
    ports:
      - '${OPENWA_BIND_ADDRESS:-127.0.0.1}:${OPENWA_PORT:-2785}:2785'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  uploads-data:
  openwa-data:
